<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermal Survival Assay — Data Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef2f0;
    --panel: #ffffff;
    --ink: #16211f;
    --ink-soft: #5b6864;
    --line: #d7ded9;
    --line-strong: #b9c3bd;
    --accent-neutral: #3c4a46;
    --good: #3f7a52;
    --bad: #b23b2e;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'IBM Plex Sans', 'Helvetica Neue', sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding: 28px;
  }
  header.top{
    position:relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 26px;
    margin-bottom: 20px;
  }
  h1{
    font-family: var(--mono);
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0 0 18px 0;
    text-transform: uppercase;
  }
  .sub{
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 18px;
  }
  .meta-row{
    display:flex; flex-wrap:wrap; gap: 20px; align-items:flex-end;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  input, select{
    font-family: var(--mono);
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: #fbfcfb;
    color: var(--ink);
    min-width: 160px;
  }
  input:focus, select:focus{ outline: 2px solid var(--accent-neutral); outline-offset: 1px; }
  .btn{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 3px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .btn:hover{ opacity: 0.88; }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn.secondary{
    background: transparent; color: var(--ink); border: 1px solid var(--line-strong);
  }
  .btn.small{ padding: 6px 10px; font-size: 12px; }
  .btn.export{
    margin-left:auto; background:#fff; color: var(--ink); border: 2px solid var(--ink);
  }
  main.baths{
    display:flex;
    flex-direction: column;
    gap: 18px;
  }
  .bath-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 14px solid var(--accent-neutral);
    border-radius: 4px;
    padding: 0 0 18px 0;
    overflow:hidden;
  }
  .bath-head{
    display:flex; justify-content:space-between; align-items:center;
    padding: 14px 18px 10px 18px;
    border-bottom: 1px solid var(--line);
  }
  .bath-head .label{
    font-family: var(--mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .timer-block{
    display:flex; align-items:center; gap:10px; padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: #f7f9f8;
  }
  .timer-display{
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.03em;
    min-width: 92px;
  }
  .start-time{
    font-size: 11px;
    color: var(--ink-soft);
    font-family: var(--mono);
    margin-left: 4px;
  }
  .tabs{
    display:flex; flex-wrap:wrap; gap: 2px;
    padding: 10px 18px 0 18px;
    border-bottom: 1px solid var(--line);
  }
  .tab{
    font-family: var(--mono);
    font-size: 11px;
    padding: 7px 10px;
    cursor:pointer;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tab.active{ color: var(--ink); border-bottom: 2px solid var(--ink); font-weight:600; }
  .tab-close{
    margin-left: 6px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .tab-close:hover{ color: var(--bad); }
  .tab-content{ padding: 16px 18px 0 18px; }
  .pop-row{
    display:flex; gap: 8px; align-items:center; margin-bottom: 8px;
  }
  .pop-row input[type=text]{ min-width: 120px; flex:1; }
  .pop-row input[type=number]{ min-width: 90px; width: 90px; }
  .pop-row .rm{
    background:none; border:none; color: var(--bad); cursor:pointer; font-size:16px; font-family: var(--mono);
  }
  .status-line{
    font-size: 12px; color: var(--ink-soft); margin: 10px 0; min-height: 16px;
  }
  .status-line.warn{ color: var(--bad); }
  .plate{
    display:grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    margin: 8px 0 14px 0;
    max-width: 620px;
  }
  .well{
    aspect-ratio: 1; border-radius: 4px; border: 1px solid var(--line-strong);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: var(--mono); font-size: 10px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    position:relative;
  }
  .well.empty{ background: #eef1ef; color: var(--ink-soft); text-shadow:none; border-style: dashed; }
  .well .wl{ font-weight:700; font-size: 10px; }
  .well .pn{ font-size: 8px; opacity: 0.9; margin-top:1px; text-align:center; padding:0 2px; }
  .well.interactive{ cursor:pointer; }
  .well.dead{ filter: grayscale(0.75) brightness(0.8); }
  .well.dead::after{
    content:"✕"; position:absolute; top:2px; right:3px; font-size:11px; color:#fff; font-weight:700;
  }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color: var(--ink-soft); }
  .legend-swatch{ width:10px; height:10px; border-radius:2px; }
  .empty-note{
    font-size: 12px; color: var(--ink-soft); font-style: italic; padding: 10px 0 4px 0;
  }
  .field-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-bottom: 14px; }
  .field-grid .field.full{ grid-column: 1 / -1; }
  .flag-icon{
    position:absolute; top:1px; left:1px; font-size:18px; line-height:1;
    color: rgba(255,255,255,0.6); cursor:pointer;
    padding: 2px 3px;
  }
  .flag-icon:hover{ color:#fff; }
  .flag-icon.flagged{ color:#ffd23f; text-shadow: 0 0 2px rgba(0,0,0,0.6); }
  .well.empty .flag-icon{ display:none; }
  .alarm-controls{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
  }
  .inline-label{
    font-size: 11px; text-transform:uppercase; letter-spacing:0.06em;
    color: var(--ink-soft); font-weight:600;
  }
  .alarm-controls input[type=text]{ min-width: 90px; width: 90px; padding: 6px 8px; font-family: var(--mono); }
  .alarm-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    display:inline-flex; align-items:center; gap:4px;
    font-family: var(--mono); font-size: 11px;
    background: #eef1ef; border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 3px 8px 3px 10px; color: var(--ink);
  }
  .chip.triggered{ background:#e8f2ea; border-color: var(--good); color: var(--good); }
  .chip-x{
    background:none; border:none; cursor:pointer; color: var(--ink-soft);
    font-family: var(--mono); font-size: 13px; line-height:1; padding:0;
  }
  .chip-x:hover{ color: var(--bad); }
  .alarm-banner{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    padding: 10px 18px; background:#fdf3e0; border-bottom: 1px solid #e8c976;
    font-size: 13px; font-weight:600;
  }
  .alarm-banner.active{ display:flex; }
  .alarm-dismiss{
    background:none; border: 1px solid var(--ink-soft); border-radius:3px;
    padding: 4px 10px; font-size:11px; cursor:pointer; color: var(--ink);
  }
  @keyframes alarmFlash{
    0%, 100% { box-shadow: none; }
    50% { box-shadow: 0 0 0 4px rgba(232,185,58,0.65); }
  }
  .bath-card.alarm-flash{ animation: alarmFlash 0.6s ease-in-out 3; }
  footer{
    margin-top: 26px; font-size: 11px; color: var(--ink-soft); text-align:center;
  }
</style>
</head>
<body>

<header class="top">
  <h1>ZEAL Survival Logger</h1>
  <div class="meta-row">
    <div class="field">
      <label for="expDate">Experiment date</label>
      <input type="date" id="expDate" oninput="meta.date=this.value">
    </div>
    <div class="field">
      <label for="observer">Observer</label>
      <input type="text" id="observer" placeholder="Initials or name" oninput="meta.observer=this.value">
    </div>
    <button class="btn export" onclick="exportAllCSV()">Export All (CSV)</button>
  </div>
</header>

<main class="baths" id="bathsRoot"></main>

<footer>Data stays in this browser tab only — nothing is uploaded. Export CSV (per plate or all) to save your work.</footer>

<script>
// ---------- state ----------
const meta = { date: '', observer: '' };
const POP_PALETTE = ['#2E6E9E','#B54428','#4F8F5B','#C99A2E','#7A5FA0','#3E9C9C','#C2577E','#7D7D7D'];

function newBath(index){
  return {
    index,
    id: '',
    setTemp: '',
    readTemp: '',
    populations: [{ name:'', count:'' }],
    wells: new Array(20).fill(null),
    flags: new Array(20).fill(false),
    assigned: false,
    activeTab: 'setup',
    timer: { running:false, startTs:null, elapsedMs:0, firstStartTime:null },
    timepoints: [], // {minute, label, data:{wellIndex:boolean}}
    alarms: [], // {id, minutes, triggered}
    pendingAlerts: [],
    alarmSoundInterval: null
  };
}
const baths = [newBath(0), newBath(1), newBath(2)];

// ---------- helpers ----------
function wellLabel(i){
  const row = Math.floor(i/5), col = i%5;
  return String.fromCharCode(65+row) + (col+1);
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}
function popColor(bath, name){
  const idx = bath.populations.findIndex(p=>p.name===name);
  return POP_PALETTE[(idx<0?0:idx) % POP_PALETTE.length];
}
function tempToColor(tempStr){
  const t = parseFloat(tempStr);
  if(isNaN(t)) return 'var(--accent-neutral)';
  if(t <= 30) return 'hsl(210 55% 40%)';
  const clamped = Math.max(30, Math.min(40, t));
  const frac = (clamped-30)/10;
  const hue = 210 - frac*200; // 210 (blue) at 30°C -> 10 (red) at 40°C
  return `hsl(${hue.toFixed(0)} 55% 40%)`;
}
function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  const pad = n => String(n).padStart(2,'0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}
function getElapsedMs(bath){
  return bath.timer.elapsedMs + (bath.timer.running ? Date.now()-bath.timer.startTs : 0);
}
function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

// ---------- structural actions ----------
function updateBathField(i, field, value){
  baths[i][field] = value;
  if(field === 'setTemp'){
    const card = document.getElementById(`card-${i}`);
    if(card) card.style.borderTopColor = tempToColor(value);
  }
}
function addPopRow(i){
  baths[i].populations.push({ name:'', count:'' });
  renderApp();
}
function removePopRow(i, idx){
  baths[i].populations.splice(idx,1);
  if(baths[i].populations.length===0) baths[i].populations.push({name:'',count:''});
  renderApp();
  validateAssign(i);
}
function updatePop(i, idx, field, value){
  baths[i].populations[idx][field] = value;
  validateAssign(i);
}
function validateAssign(i){
  const bath = baths[i];
  const pops = bath.populations.filter(p=>p.name.trim() && Number(p.count)>0);
  const total = pops.reduce((s,p)=>s+Number(p.count),0);
  const statusEl = document.getElementById(`status-${i}`);
  const btnEl = document.getElementById(`assign-btn-${i}`);
  if(!statusEl || !btnEl) return;
  if(total===0){
    statusEl.textContent = 'Add at least one population with a count greater than 0.';
    statusEl.className = 'status-line';
    btnEl.disabled = true;
  } else if(total>20){
    statusEl.textContent = `${total} individuals exceeds the 20 wells available.`;
    statusEl.className = 'status-line warn';
    btnEl.disabled = true;
  } else {
    statusEl.textContent = `${total} of 20 wells will be filled.`;
    statusEl.className = 'status-line';
    btnEl.disabled = false;
  }
}
function assignWells(i){
  const bath = baths[i];
  const pops = bath.populations.filter(p=>p.name.trim() && Number(p.count)>0);
  const total = pops.reduce((s,p)=>s+Number(p.count),0);
  if(total===0 || total>20) return;
  if(bath.timepoints.length>0){
    if(!confirm('Reassigning wells will clear existing timepoint data for this water bath. Continue?')) return;
    bath.timepoints = [];
  }
  let individuals = [];
  pops.forEach(p=>{ for(let n=0;n<Number(p.count);n++) individuals.push(p.name); });
  const slots = [...Array(20).keys()];
  shuffle(slots);
  const wells = new Array(20).fill(null);
  individuals.forEach((name, idx)=>{ wells[slots[idx]] = { population: name }; });
  bath.wells = wells;
  bath.flags = new Array(20).fill(false);
  bath.assigned = true;
  bath.activeTab = 'plate';
  renderApp();
}
function removeTimepoint(i, tpIdx){
  const bath = baths[i];
  const tp = bath.timepoints[tpIdx];
  if(!confirm(`Remove the "${tp.label}" timepoint tab? This will delete its recorded data.`)) return;
  bath.timepoints.splice(tpIdx, 1);
  if(bath.activeTab === `tp-${tpIdx}`){
    bath.activeTab = 'plate';
  } else if(bath.activeTab.startsWith('tp-')){
    const activeIdx = parseInt(bath.activeTab.split('-')[1], 10);
    if(activeIdx > tpIdx) bath.activeTab = `tp-${activeIdx-1}`;
  }
  renderApp();
}
function toggleFlag(i, w){
  baths[i].flags[w] = !baths[i].flags[w];
  const cell = document.getElementById(`well-${i}-${w}`);
  if(cell){
    const iconEl = cell.querySelector('.flag-icon');
    if(iconEl) iconEl.classList.toggle('flagged', baths[i].flags[w]);
  }
}

// ---------- alarms ----------
function parseAlarmTime(str){
  const parts = str.trim().split(':').map(p=>p.trim());
  if(parts.length===0 || parts.some(p=>p==='' || isNaN(Number(p)))) return NaN;
  let h=0, m=0, s=0;
  if(parts.length===3){ [h,m,s] = parts.map(Number); }
  else if(parts.length===2){ [h,m] = parts.map(Number); }
  else if(parts.length===1){ [m] = parts.map(Number); }
  else return NaN;
  return h*60 + m + s/60;
}
function renderAlarmChips(i){
  const bath = baths[i];
  if(bath.alarms.length===0) return '';
  return bath.alarms.map(a=>`<span class="chip${a.triggered?' triggered':''}">${formatElapsed(a.minutes*60000)}<button class="chip-x" onclick="removeAlarm(${i},'${a.id}')" title="Remove alarm">&times;</button></span>`).join('');
}
function addAlarm(i){
  const inp = document.getElementById(`alarm-input-${i}`);
  const val = parseAlarmTime(inp.value);
  if(isNaN(val) || val<0){ alert('Enter a valid alarm time as hh:mm:ss (e.g. 0:05:00), mm:ss, or minutes.'); return; }
  baths[i].alarms.push({ id: 'a'+Date.now()+Math.random().toString(36).slice(2,6), minutes: val, triggered:false });
  baths[i].alarms.sort((a,b)=>a.minutes-b.minutes);
  inp.value = '';
  const chipsEl = document.getElementById(`alarm-chips-${i}`);
  if(chipsEl) chipsEl.innerHTML = renderAlarmChips(i);
}
function removeAlarm(i, id){
  baths[i].alarms = baths[i].alarms.filter(a=>a.id!==id);
  const chipsEl = document.getElementById(`alarm-chips-${i}`);
  if(chipsEl) chipsEl.innerHTML = renderAlarmChips(i);
}
function playBeep(delay){
  setTimeout(()=>{
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.value = 0.15;
      o.start();
      setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
    }catch(e){}
  }, delay);
}
function playAlarmSound(){
  playBeep(0); playBeep(450); playBeep(900);
}
function renderAlarmBanner(i){
  const bath = baths[i];
  const banner = document.getElementById(`alarm-banner-${i}`);
  if(!banner) return;
  if(bath.pendingAlerts.length===0){
    banner.classList.remove('active');
    banner.innerHTML = '';
    return;
  }
  banner.classList.add('active');
  banner.innerHTML = `<span>⏰ ${bath.pendingAlerts.join(' • ')}</span><button class="alarm-dismiss" onclick="dismissAlarmBanner(${i})">Dismiss</button>`;
}
function dismissAlarmBanner(i){
  baths[i].pendingAlerts = [];
  if(baths[i].alarmSoundInterval){
    clearInterval(baths[i].alarmSoundInterval);
    baths[i].alarmSoundInterval = null;
  }
  renderAlarmBanner(i);
  const card = document.getElementById(`card-${i}`);
  if(card) card.classList.remove('alarm-flash');
}
function checkAlarms(i){
  const bath = baths[i];
  const elapsedMin = getElapsedMs(bath)/60000;
  let fired = false;
  bath.alarms.forEach(a=>{
    if(!a.triggered && elapsedMin >= a.minutes){
      a.triggered = true;
      bath.pendingAlerts.push(`Alarm at ${formatElapsed(a.minutes*60000)}`);
      fired = true;
    }
  });
  if(fired){
    renderAlarmBanner(i);
    const chipsEl = document.getElementById(`alarm-chips-${i}`);
    if(chipsEl) chipsEl.innerHTML = renderAlarmChips(i);
    const card = document.getElementById(`card-${i}`);
    if(card){
      card.classList.add('alarm-flash');
      setTimeout(()=>card.classList.remove('alarm-flash'), 3000);
    }
    if(!bath.alarmSoundInterval){
      playAlarmSound();
      bath.alarmSoundInterval = setInterval(()=>playAlarmSound(), 4000);
    }
  }
}

function switchTab(i, tab){
  baths[i].activeTab = tab;
  renderApp();
}
function toggleTimer(i){
  const t = baths[i].timer;
  if(t.running){
    t.elapsedMs += Date.now()-t.startTs;
    t.running = false;
  } else {
    if(!t.firstStartTime) t.firstStartTime = new Date();
    t.startTs = Date.now();
    t.running = true;
  }
  renderTimerControls(i);
}
function resetTimer(i){
  if(!confirm('Reset the stopwatch for this water bath? This does not delete existing timepoint tabs.')) return;
  const t = baths[i].timer;
  t.running = false; t.startTs = null; t.elapsedMs = 0; t.firstStartTime = null;
  baths[i].alarms.forEach(a=>a.triggered=false);
  baths[i].pendingAlerts = [];
  if(baths[i].alarmSoundInterval){
    clearInterval(baths[i].alarmSoundInterval);
    baths[i].alarmSoundInterval = null;
  }
  renderTimerControls(i);
  renderAlarmBanner(i);
  const chipsEl = document.getElementById(`alarm-chips-${i}`);
  if(chipsEl) chipsEl.innerHTML = renderAlarmChips(i);
  const card = document.getElementById(`card-${i}`);
  if(card) card.classList.remove('alarm-flash');
}
function addTimepoint(i){
  const bath = baths[i];
  if(!bath.assigned){ alert('Assign individuals to wells before adding a timepoint.'); return; }
  const elapsedMin = Math.floor(getElapsedMs(bath)/60000);
  const lastTp = bath.timepoints[bath.timepoints.length-1];
  const data = {};
  for(let w=0; w<20; w++){
    if(bath.wells[w]) data[w] = lastTp ? lastTp.data[w] : true;
  }
  bath.timepoints.push({ minute: elapsedMin, label: `${elapsedMin} min`, data });
  bath.activeTab = `tp-${bath.timepoints.length-1}`;
  renderApp();
}
function toggleWell(i, tpIdx, wellIdx){
  const tp = baths[i].timepoints[tpIdx];
  tp.data[wellIdx] = !tp.data[wellIdx];
  const cell = document.getElementById(`well-${i}-${wellIdx}`);
  if(cell) cell.classList.toggle('dead', !tp.data[wellIdx]);
}

// ---------- timer ticking ----------
setInterval(()=>{
  baths.forEach((b, i)=>{
    if(b.timer.running){
      renderTimerControls(i, true);
      checkAlarms(i);
    }
  });
}, 500);

function renderTimerControls(i, tickOnly){
  const disp = document.getElementById(`timer-disp-${i}`);
  if(disp) disp.textContent = formatElapsed(getElapsedMs(baths[i]));
  if(tickOnly) return;
  const btn = document.getElementById(`timer-btn-${i}`);
  if(btn) btn.textContent = baths[i].timer.running ? 'Pause' : (baths[i].timer.elapsedMs>0 ? 'Resume' : 'Start');
  const startEl = document.getElementById(`start-time-${i}`);
  const fst = baths[i].timer.firstStartTime;
  if(startEl) startEl.textContent = fst ? `Started ${fst.toLocaleTimeString()}` : '';
}

// ---------- unsaved data warning ----------
function hasRecordedData(){
  return baths.some(b => b.timepoints.length > 0) ||
         !!meta.date || !!meta.observer ||
         baths.some(b => b.id || b.setTemp || b.readTemp || b.assigned);
}
window.addEventListener('beforeunload', (e)=>{
  if(hasRecordedData()){
    e.preventDefault();
    e.returnValue = '';
  }
});

// ---------- rendering ----------
function renderPlate(i, tpIdx){
  const bath = baths[i];
  const interactive = tpIdx !== undefined;
  const tp = interactive ? bath.timepoints[tpIdx] : null;
  let html = '';
  if(!bath.assigned){
    return `<div class="empty-note">No individuals assigned to wells yet. Fill out Setup and click "Assign Individuals to Wells".</div>`;
  }
  const popsUsed = [...new Set(bath.wells.filter(w=>w).map(w=>w.population))];
  html += `<div class="legend">${popsUsed.map(name=>`<span class="legend-item"><span class="legend-swatch" style="background:${popColor(bath,name)}"></span>${name}</span>`).join('')}<span class="legend-item">⚑ flag a well</span></div>`;
  html += `<div class="plate">`;
  for(let w=0; w<20; w++){
    const well = bath.wells[w];
    if(!well){
      html += `<div class="well empty"><span class="wl">${wellLabel(w)}</span></div>`;
    } else {
      const color = popColor(bath, well.population);
      const alive = interactive ? tp.data[w] : true;
      const deadClass = interactive && !alive ? ' dead' : '';
      const clickAttr = interactive ? ` onclick="toggleWell(${i},${tpIdx},${w})"` : '';
      const interactiveClass = interactive ? ' interactive' : '';
      html += `<div class="well${deadClass}${interactiveClass}" id="well-${i}-${w}" style="background:${color}"${clickAttr}>
        <span class="flag-icon${bath.flags[w] ? ' flagged':''}" onclick="event.stopPropagation(); toggleFlag(${i},${w})" title="Flag this well">⚑</span>
        <span class="wl">${wellLabel(w)}</span><span class="pn">${well.population}</span>
      </div>`;
    }
  }
  html += `</div>`;
  return html;
}

function renderTabContent(i){
  const bath = baths[i];
  if(bath.activeTab === 'setup'){
    return `
      <div class="field-grid">
        <div class="field">
          <label>Water bath ID</label>
          <input type="text" value="${bath.id}" oninput="updateBathField(${i},'id',this.value)" placeholder="e.g. WB-1">
        </div>
        <div class="field">
          <label>Set temperature (°C)</label>
          <input type="number" step="0.1" value="${bath.setTemp}" oninput="updateBathField(${i},'setTemp',this.value)" placeholder="e.g. 32">
        </div>
        <div class="field full">
          <label>Temperature read (°C)</label>
          <input type="number" step="0.1" value="${bath.readTemp}" oninput="updateBathField(${i},'readTemp',this.value)" placeholder="measured value">
        </div>
      </div>
      <label>Populations</label>
      <div id="pop-list-${i}" style="margin-top:6px;">
        ${bath.populations.map((p,idx)=>`
          <div class="pop-row">
            <input type="text" placeholder="Population name" value="${p.name}" oninput="updatePop(${i},${idx},'name',this.value)">
            <input type="number" min="0" placeholder="count" value="${p.count}" oninput="updatePop(${i},${idx},'count',this.value)">
            <button class="rm" title="Remove population" onclick="removePopRow(${i},${idx})">&times;</button>
          </div>
        `).join('')}
      </div>
      <button class="btn secondary small" onclick="addPopRow(${i})">+ Add population</button>
      <div class="status-line" id="status-${i}"></div>
      <button class="btn" id="assign-btn-${i}" onclick="assignWells(${i})">Assign Individuals to Wells</button>
    `;
  }
  if(bath.activeTab === 'plate'){
    return renderPlate(i);
  }
  if(bath.activeTab.startsWith('tp-')){
    const tpIdx = parseInt(bath.activeTab.split('-')[1],10);
    return renderPlate(i, tpIdx);
  }
  return '';
}

function renderTabs(i){
  const bath = baths[i];
  const staticTabs = [
    { key:'setup', label:'Setup' },
    { key:'plate', label:'Plate Diagram' }
  ];
  let html = staticTabs.map(t=>`<div class="tab ${bath.activeTab===t.key?'active':''}" onclick="switchTab(${i},'${t.key}')">${t.label}</div>`).join('');
  html += bath.timepoints.map((tp,idx)=>{
    const key = `tp-${idx}`;
    return `<div class="tab ${bath.activeTab===key?'active':''}" onclick="switchTab(${i},'${key}')">${tp.label}<span class="tab-close" onclick="event.stopPropagation(); removeTimepoint(${i},${idx})" title="Remove this timepoint">&times;</span></div>`;
  }).join('');
  return html;
}

function renderBathCard(i){
  const bath = baths[i];
  return `
    <div class="bath-card" id="card-${i}" style="border-top-color:${tempToColor(bath.setTemp)}">
      <div class="bath-head">
        <div class="label">Water Bath ${i+1}${bath.id ? ' — ' + bath.id : ''}</div>
        <button class="btn secondary small" onclick="exportBathCSV(${i})">Export CSV</button>
      </div>
      <div class="alarm-banner" id="alarm-banner-${i}"></div>
      <div class="timer-block">
        <span class="timer-display" id="timer-disp-${i}">${formatElapsed(getElapsedMs(bath))}</span>
        <span class="start-time" id="start-time-${i}">${bath.timer.firstStartTime ? 'Started ' + bath.timer.firstStartTime.toLocaleTimeString() : ''}</span>
        <button class="btn secondary small" id="timer-btn-${i}" onclick="toggleTimer(${i})">${bath.timer.running?'Pause':(bath.timer.elapsedMs>0?'Resume':'Start')}</button>
        <button class="btn secondary small" onclick="resetTimer(${i})">Reset</button>
        <button class="btn secondary small" onclick="addTimepoint(${i})">+ Add Timepoint Tab</button>
      </div>
      <div class="alarm-controls">
        <label class="inline-label">Alarm at</label>
        <input type="text" id="alarm-input-${i}" placeholder="hh:mm:ss">
        <button class="btn secondary small" onclick="addAlarm(${i})">+ Add Alarm</button>
        <div class="alarm-chips" id="alarm-chips-${i}">${renderAlarmChips(i)}</div>
      </div>
      <div class="tabs">${renderTabs(i)}</div>
      <div class="tab-content">${renderTabContent(i)}</div>
    </div>
  `;
}

function renderApp(){
  const root = document.getElementById('bathsRoot');
  root.innerHTML = baths.map((b,i)=>renderBathCard(i)).join('');
  baths.forEach((b,i)=>{ validateAssign(i); renderTimerControls(i); renderAlarmBanner(i); });
}
renderApp();

// ---------- export ----------
const CSV_HEADERS = ['experiment_date','observer','water_bath_id','set_temp_c','read_temp_c','stopwatch_start_time','timepoint_min','well_id','population','responding','flagged','sex','stage','length'];

function buildBathRows(bath){
  const rows = [];
  bath.timepoints.forEach(tp=>{
    for(let w=0; w<20; w++){
      if(!bath.wells[w]) continue;
      rows.push([
        meta.date, meta.observer, bath.id, bath.setTemp, bath.readTemp,
        bath.timer.firstStartTime ? bath.timer.firstStartTime.toISOString() : '',
        tp.minute, wellLabel(w), bath.wells[w].population,
        tp.data[w] ? 'yes':'no',
        bath.flags[w] ? 'yes':'no',
        '', '', ''
      ]);
    }
  });
  return rows;
}
function bathFileName(bath){
  const datePart = meta.date || new Date().toISOString().slice(0,10);
  const tempPart = (bath.setTemp !== '' && bath.setTemp !== null && !isNaN(parseFloat(bath.setTemp))) ? `${bath.setTemp}C` : 'NA';
  const idPart = (bath.id ? bath.id : `bath${bath.index+1}`).replace(/[^a-zA-Z0-9_-]+/g,'_');
  return `survival_assay_${datePart}_${tempPart}_${idPart}.csv`;
}
function downloadCSV(filename, rows){
  const csv = [CSV_HEADERS, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportBathCSV(i){
  const bath = baths[i];
  const rows = buildBathRows(bath);
  if(rows.length===0){ alert('No timepoint data recorded yet for this water bath.'); return; }
  downloadCSV(bathFileName(bath), rows);
}
function exportAllCSV(){
  let any = false;
  baths.forEach(bath=>{
    const rows = buildBathRows(bath);
    if(rows.length>0){
      downloadCSV(bathFileName(bath), rows);
      any = true;
    }
  });
  if(!any) alert('No timepoint data recorded yet. Add at least one timepoint before exporting.');
}

</script>
